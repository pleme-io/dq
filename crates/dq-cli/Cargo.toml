[package]
name = "dq-cli"
description = "Universal infrastructure data query tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dq"
path = "src/main.rs"

[features]
# `lisp` is default: the substrate gen+lockfile-builder resolves ONE feature
# set into the committed Cargo.gen.lock, and the flagship consumer (the
# repo-docs generator's `dq verify-mermaid`) needs it. The previous opt-in
# (`default = []`) existed only to keep *crate2nix's* feature closure simple
# — a constraint the gen migration removed. `dq` and `dq-full` are now the
# same binary; the no-lisp slim build can return as a second resolved spec
# if a real consumer ever needs it.
default = ["lisp"]
# Enables `dq verify-mermaid` + `dq -t lisp` / `-f lisp` s-expression I/O at
# the CLI layer. All tatara-lisp access flows through shikumi (which already
# owns the lisp reader/ast path) so dq-cli needs no direct tatara-lisp dep.
lisp = [
    "shikumi/lisp",
    "dep:shikumi",
    "dep:serde",
    "dep:sha2",
]

[dependencies]
dq-core = { path = "../dq-core" }
dq-formats = { path = "../dq-formats" }
dq-query = { path = "../dq-query" }
dq-merge = { path = "../dq-merge" }
dq-terragrunt = { path = "../dq-terragrunt" }
dq-scan = { path = "../dq-scan" }
dq-viz = { path = "../dq-viz" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
# Used by tg list --to json to walk the dq-terragrunt DAG and build
# typed records via dq_core::Value.
indexmap = { workspace = true }
petgraph = { workspace = true }

# Lisp-backed verifier (only compiled when `lisp` feature is enabled).
shikumi = { version = "0.1.496", optional = true }
serde = { workspace = true, optional = true }
# SHA-256 for the projection hash — matches the Python pipeline's
# fallback (when blake3 isn't available) so the hashes compare.
sha2 = { version = "0.10", optional = true }
